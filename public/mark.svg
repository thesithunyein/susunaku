<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Susunaku">
  <title>Susunaku</title>
  <defs>
    <linearGradient id="susuCoinFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD978" />
      <stop offset="100%" stop-color="#D9A520" />
    </linearGradient>
  </defs>

  <!-- Three members: chunky rounded bars on a ring, 120 degrees apart. The
       middle stays empty, because nothing is held in the middle. -->
  <g fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="20" stroke="#0B0B0C" stroke-width="11" stroke-dasharray="32.5 93.1637" />
    <circle cx="32" cy="32" r="20" stroke="#4A54E1" stroke-width="6.4" stroke-dasharray="32.5 93.1637" />
    <circle cx="32" cy="32" r="20" stroke="#0B0B0C" stroke-width="11" stroke-dasharray="32.5 93.1637" stroke-dashoffset="-41.8879" />
    <circle cx="32" cy="32" r="20" stroke="#D9A520" stroke-width="6.4" stroke-dasharray="32.5 93.1637" stroke-dashoffset="-41.8879" />
    <circle cx="32" cy="32" r="20" stroke="#0B0B0C" stroke-width="11" stroke-dasharray="32.5 93.1637" stroke-dashoffset="-83.7758" />
    <circle cx="32" cy="32" r="20" stroke="#2FA84F" stroke-width="6.4" stroke-dasharray="32.5 93.1637" stroke-dashoffset="-83.7758" />
  </g>

  <!-- The coin that passes between them. -->
  <circle cx="32" cy="12" r="9" fill="url(#susuCoinFace)" stroke="#0B0B0C" stroke-width="2.8" />
  <circle cx="29.3" cy="10.4" r="1.7" fill="#0B0B0C" />
  <circle cx="34.7" cy="10.4" r="1.7" fill="#0B0B0C" />
  <path d="M28.8 13.9 Q32 17.1 35.2 13.9" fill="none" stroke="#0B0B0C" stroke-width="1.8" stroke-linecap="round" />
</svg>
